[project]
name = "ai-tutorial-claims"
version = "0.1.0"
description = "Workshop task: extract an expense-claim CSV from messy Singapore receipts"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["check.py"]

[dependency-groups]
dev = ["ruff>=0.16.3", "pyright>=1.1.411", "pre-commit>=4.6.2"]

[tool.ruff]
# Ruff formats Python blocks inside markdown, which rewrites quoted snippets.
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pyright]
include = ["check.py", ".instructor/generate", ".instructor/test_claims.py"]
extraPaths = [".instructor/generate"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
